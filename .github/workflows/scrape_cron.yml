name: Trigger HF Space Scraper

on:
  schedule:
    # Run at 09:00 and 18:00 UTC
    - cron: '0 9,18 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space Trigger Endpoint
        run: |
          # Replace with your actual Hugging Face Space URL when known
          curl -X POST https://your-hf-space-url.hf.space/api/trigger-scrape
